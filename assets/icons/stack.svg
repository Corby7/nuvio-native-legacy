<!-- The player's Sources button: Phosphor's stack, BOLD weight, the same 24-unit
     stroke on a 256 grid as every other glyph on the transport row (the web
     app's ic_player_* files are all Phosphor bold). The title screen's
     button draws the same bold glyph from detail_stack.svg, with a filled twin.

     THE ALPHA IS THE GLYPH: gfx_icon draws with GFX_BRAND, which takes the shape
     from the texture's alpha and the colour from the caller. rsvg-convert with
     no background flag gives exactly that. Do not flatten it onto a ground. -->
