<!-- The "Instant" mark on a row of the sources sheet: a source that will start
     playing when OK is pressed rather than after a download nobody can watch
     the progress of.

     It is the SAME glyph the web app uses (CACHED_ICON_SVG in
     js/ui/screens/stream/streamScreen.js, Phosphor's lightning, fill) and it
     lives here rather than in NuvioWeb/assets/icons because the web app carries
     it inline in a string, not as a file.

     THE ALPHA IS THE GLYPH: gfx_icon draws with GFX_BRAND, which takes the shape
     from the texture's alpha and the colour from the caller. rsvg-convert with
     no background flag gives exactly that. Do not flatten it onto a ground. -->
