<!-- The title screen's Sources button at rest: Phosphor's stack, BOLD weight —
     the same glyph and 24-unit stroke as the player's (stack.svg), so the button
     reads as the same Sources in both places. detail_stack_filled.svg is its
     focused twin, the solid stack-fill, which has no weight of its own.

     THE ALPHA IS THE GLYPH: gfx_icon draws with GFX_BRAND, which takes the shape
     from the texture's alpha and the colour from the caller. rsvg-convert with
     no background flag gives exactly that. Do not flatten it onto a ground. -->
